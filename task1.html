<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/task1.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">

        <main class="booking-card">
          <header class="booking-header">
            <h1>Book a train ticket</h1>
          </header>

          <form class="booking-body p-3 p-md-4" method="get">

            <div class="btn-group trip-toggle mb-3" role="group" aria-label="Trip type">
              <input type="radio" class="btn-check" name="trip" id="oneWay" value="one-way" checked>
              <label class="btn trip-option" for="oneWay">One way</label>
              <input type="radio" class="btn-check" name="trip" id="roundTrip" value="round-trip">
              <label class="btn trip-option" for="roundTrip">Round trip</label>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="Astana" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" required>
                  <label for="to">To</label>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers">
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <div class="col-12">
                <fieldset>
                  <legend class="form-label">Carriage class</legend>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                    <label class="form-check-label" for="seat">Seat</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
                    <label class="form-check-label" for="coupe">Coupé</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                    <label class="form-check-label" for="sleeper">Sleeper</label>
                  </div>
                </fieldset>
              </div>

              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" id="phone-prefix">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone"
                         placeholder="701 234 56 78" aria-describedby="phone-prefix" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="name@example.com" required>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>
              </div>
            </div>

            <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 gap-sm-3 mt-4">
              <button type="reset" class="btn btn-clear">Clear</button>
              <button type="submit" class="btn btn-find">Find trains</button>
            </div>
          </form>
        </main>

      </div>
    </div>
  </div>
</body>
</html>
